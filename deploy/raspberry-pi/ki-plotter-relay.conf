# Configuration du relais KI Plotter (Raspberry Pi branché au plotter)
# Après une modification : sudo systemctl restart ki-plotter-relay
#
# Les réglages faits sur l'écran du Pi (ou sa page web) sont enregistrés dans
# /var/lib/ki-plotter-relay/settings.conf et passent avant ceux de ce fichier.

# Nom affiché dans KI Plotter et sur l'écran (par défaut : le nom du Raspberry Pi)
#name = Atelier

# Adresse et port d'écoute (TCP pour les travaux et l'écran, UDP pour la recherche)
listen = 0.0.0.0:7870

# queue  : les travaux envoyés depuis le PC attendent qu'on appuie sur « Couper » sur l'écran
# direct : ils sont coupés dès qu'ils arrivent
mode = queue

# Plotter : « auto » prend le premier port USB série (/dev/ttyUSB0, /dev/ttyACM0…),
# sinon une imprimante USB (/dev/usb/lp0). Ou un chemin fixe, par exemple
# /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0 (liste : ki-plotter-relay --list-ports)
device = auto

# Liaison série avec le plotter
baud = 9600
flow = hardware

# Taille des blocs envoyés au plotter (octets) et pause entre deux blocs (ms)
chunk_size = 256
chunk_delay_ms = 0

# Taille maximale d'un travail (Mo)
max_job_mb = 64
