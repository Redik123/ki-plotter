# Configuration du relais KI Plotter (Raspberry Pi branché au plotter)
# Après une modification : sudo systemctl restart ki-plotter-relay

# Nom affiché dans KI Plotter (par défaut : le nom du Raspberry Pi)
#name = Atelier

# Adresse et port d'écoute (TCP pour les travaux, UDP pour la recherche automatique)
listen = 0.0.0.0:7870

# Plotter : « auto » prend le premier port USB série (/dev/ttyUSB0, /dev/ttyACM0…),
# sinon une imprimante USB (/dev/usb/lp0). Ou un chemin fixe, par exemple
# /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0 (liste : ki-plotter-relay --list-ports)
device = auto

# Liaison série utilisée si l'ordinateur n'envoie pas la sienne.
# KI Plotter envoie toujours le débit et le contrôle de flux de la fenêtre Découper.
baud = 9600
flow = hardware

# Taille des blocs envoyés au plotter (octets) et pause entre deux blocs (ms)
chunk_size = 256
chunk_delay_ms = 0

# Taille maximale d'un travail (Mo)
max_job_mb = 64
